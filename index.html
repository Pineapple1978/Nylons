<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LDPE / HDPE Weight Calculator</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f6fb;
    margin:0;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#003366;
    margin-bottom:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td{
    padding:12px;
    border:1px solid #ddd;
}

input,select{
    width:100%;
    padding:8px;
    font-size:15px;
}

.result{
    background:#eaf5ff;
    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#666;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<h2>LDPE / HDPE Weight Calculator</h2>

<table>

<tr>
<td>Material</td>
<td>
<select id="material">
<option value="LDPE">LDPE</option>
<option value="HDPE">HDPE</option>
</select>
</td>
</tr>

<tr>
<td>LDPE Density (gm/cm³)</td>
<td><input type="number" id="ldpeDensity" value="0.92" step="0.01"></td>
</tr>

<tr>
<td>HDPE Density (gm/cm³)</td>
<td><input type="number" id="hdpeDensity" value="0.95" step="0.01"></td>
</tr>

<tr>
<td>Width (cm)</td>
<td><input type="number" id="width" value="60"></td>
</tr>

<tr>
<td>Length (cm)</td>
<td><input type="number" id="length" value="100"></td>
</tr>

<tr>
<td>Thickness (Micron)</td>
<td><input type="number" id="thickness" value="40"></td>
</tr>

<tr>
<td>Price / Kg</td>
<td><input type="number" id="priceKg" value="3500"></td>
</tr>

</table>

<br>

<table>

<tr class="result">
<td>Selected Density (gm/cm³)</td>
<td id="density"></td>
</tr>

<tr class="result">
<td>Bag Volume (cm³)</td>
<td id="volume"></td>
</tr>

<tr class="result">
<td>Weight (gm)</td>
<td id="weight"></td>
</tr>

<tr class="result">
<td>Price / Bag</td>
<td id="price"></td>
</tr>

</table>

<div class="footer">
Plastic Film Weight & Cost Calculator
</div>

</div>

<script>

function calculate(){

let material=document.getElementById("material").value;

let ldpe=parseFloat(document.getElementById("ldpeDensity").value);

let hdpe=parseFloat(document.getElementById("hdpeDensity").value);

let width=parseFloat(document.getElementById("width").value);

let length=parseFloat(document.getElementById("length").value);

let micron=parseFloat(document.getElementById("thickness").value);

let priceKg=parseFloat(document.getElementById("priceKg").value);

// Convert micron to cm
let thicknessCM=micron/10000;

// Volume
let volume=width*length*thicknessCM;

// Density according to selected material
let density;

if(material==="LDPE"){
    density=ldpe;
}else{
    density=hdpe;
}

// Weight
let weight=volume*density;

// Price
let price=(weight/1000)*priceKg;

// Display
document.getElementById("density").innerHTML=density.toFixed(2);

document.getElementById("volume").innerHTML=volume.toFixed(2);

document.getElementById("weight").innerHTML=weight.toFixed(2);

document.getElementById("price").innerHTML=price.toFixed(2);

}

// Auto Calculate
document.querySelectorAll("input,select").forEach(function(item){

item.addEventListener("input",calculate);

item.addEventListener("change",calculate);

});

calculate();

</script>

</body>
</html>
