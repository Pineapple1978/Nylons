<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bag Calculator</title>
<style>
body{font-family:Arial;background:#eef;padding:30px}.c{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:10px}
table{width:100%;border-collapse:collapse}td{border:1px solid #ccc;padding:8px}input,select{width:100%;padding:6px}.res{background:#eef;font-weight:bold}
</style></head><body><div class="c"><h2>LDPE / HDPE Bag Calculator</h2>
<table>
<tr><td>Material</td><td><select id="material"><option value="">Select</option><option>LDPE</option><option>HDPE</option></select></td></tr>
<tr id="densrow" style="display:none"><td id="denslabel"></td><td><input id="dens" readonly></td></tr>
<tr><td>Width (cm)</td><td><input id="w" type="number" value="60"></td></tr>
<tr><td>Length (cm)</td><td><input id="l" type="number" value="100"></td></tr>
<tr><td>Thickness (Micron)</td><td><input id="t" type="number" value="40"></td></tr>
<tr><td>Price / Kg</td><td><input id="p" type="number" value="3500"></td></tr>
</table><br>
<table>
<tr class="res"><td>Bag Volume (cm³)</td><td id="vol"></td></tr>
<tr class="res"><td>Weight (gm)</td><td id="wt"></td></tr>
<tr class="res"><td>Price / Bag</td><td id="price"></td></tr>
</table></div>
<script>
const D={LDPE:0.92,HDPE:0.95};
function calc(){
let m=material.value;
if(!m){densrow.style.display='none';vol.textContent='';wt.textContent='';price.textContent='';return;}
densrow.style.display='';
denslabel.textContent=m+' Density (gm/cm³)';
dens.value=D[m].toFixed(2);
let width=+w.value||0,len=+l.value||0,th=+t.value||0,pk=+p.value||0;
let volume=width*len*(th/10000)*2;
let weight=volume*D[m];
let pr=weight/1000*pk;
vol.textContent=volume.toFixed(2);
wt.textContent=weight.toFixed(2);
price.textContent=pr.toFixed(2);
}
document.querySelectorAll('input,select').forEach(e=>{e.oninput=calc;e.onchange=calc;});
calc();
</script></body></html>
